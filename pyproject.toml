[project]
name = "jira-mini-mcp"
version = "1.1.0"
description = "Minimal Jira Cloud MCP server for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "httpx2",
]

[project.scripts]
jira-mini-mcp = "jira_mini_mcp.server:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    # Only evals/run_eval.py imports this, and only a deliberate run calls a
    # model. It sits in dev rather than its own group so `ty check` resolves
    # it the same way for everyone; the runtime dependencies, and therefore
    # the published wheel, are unaffected.
    "anthropic",
    "prek>=0.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_mini_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast behavioral suite. `hygiene` (docs/tool-schema
# contract checks) and `slow` (stdio subprocess) run in CI and on demand:
# `pytest -o addopts=""` runs everything.
addopts = "-m 'not hygiene and not slow'"
markers = [
    "hygiene: documentation and tool-description contract checks",
    "slow: spawns a subprocess",
]

# Read by `mutmut run` (see QUALITY.md); mutmut is not a project dependency.
[tool.mutmut]
source_paths = ["src/"]
do_not_mutate = [
    "src/jira_mini_mcp/__init__.py",
    "src/jira_mini_mcp/auth.py",
    "src/jira_mini_mcp/errors.py",
    "src/jira_mini_mcp/server.py",
]
pytest_add_cli_args = [
    "--ignore=tests/test_docs_contract.py",
    "--ignore=tests/test_tool_schema_hygiene.py",
]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.coverage.run]
branch = true
source = ["jira_mini_mcp"]
