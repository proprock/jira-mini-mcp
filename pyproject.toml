[project]
name = "jira-mini-mcp"
version = "0.9.3"
description = "Minimal Jira Cloud MCP server for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "httpx2",
]

[project.scripts]
jira-mini-mcp = "jira_mini_mcp.server:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    # Only evals/run_eval.py imports this, and only a deliberate run calls a
    # model. It sits in dev rather than its own group so `ty check` resolves
    # it the same way for everyone; the runtime dependencies, and therefore
    # the published wheel, are unaffected.
    "anthropic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_mini_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jira_mini_mcp"]
